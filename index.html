<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030405">
<meta name="description" content="l3vitov open tool — OSINT-поиск по открытым источникам">
<title>l3vitov open tool — OSINT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="background"></div><div class="vignette"></div><div class="grid"></div>

<main class="shell">
<header class="hero">
  <div class="mini-logo" aria-hidden="true">
    <i></i><i></i><i></i><i></i>
    <b class="c1"></b><b class="c2"></b><b class="c3"></b><b class="c4"></b>
  </div>
  <h1>l3vitov <span>open tool</span></h1>
  <div class="subtitle">OPEN SOURCE INTELLIGENCE / PUBLIC WEB RESEARCH</div>
</header>

<section class="panel search-panel">
  <div class="toolbar">
    <div class="modes" role="tablist">
      <button class="mode active" data-mode="all">ALL</button>
      <button class="mode" data-mode="name">ФИО</button>
      <button class="mode" data-mode="ip">IP</button>
      <button class="mode" data-mode="phone">НОМЕР</button>
      <button class="mode" data-mode="social">SOCIAL</button>
    </div>
    <button id="clearBtn" class="clear" type="button">CLEAR</button>
  </div>

  <form id="searchForm">
    <div class="search-line">
      <span class="prompt">&gt;_</span>
      <input id="query" type="search" autocomplete="off" spellcheck="false"
        placeholder="Введите ФИО, IP, номер или username">
      <button class="search" type="submit">SEARCH</button>
    </div>
  </form>
  <div class="notice"><span></span> Только открытые источники. Запросы не сохраняются сайтом.</div>
</section>

<section id="status" class="status hidden"></section>
<section id="results" class="results">
  <div class="panel welcome">
    <div class="signal">◉</div>
    <h2>READY FOR QUERY</h2>
    <p>Введите данные выше. После запроса система сформирует релевантные публичные источники.</p>
  </div>
</section>

<footer><span>L3VITOV OPEN TOOL</span><span>GITHUB PAGES / STATIC BUILD</span></footer>
</main>
<script src="script.js"></script>
</body>
</html>
